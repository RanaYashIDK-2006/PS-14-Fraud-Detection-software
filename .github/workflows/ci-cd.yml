# PS-14 — Full CI/CD Pipeline
# Runs on every push/PR: test suite → security scan → Docker build → deploy gate

name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Phase 1: Unit + Integration tests (fast feedback)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate synthetic data
        run: python backend/src/generate_synthetic_data.py

      - name: Train models
        run: python backend/src/train_compare.py

      - name: Run full regression suite
        run: python backend/scripts/regression_suite.py --fast
        env:
          PYTHONIOENCODING: utf-8

      - name: Run backup/restore test
        run: python backend/scripts/backup_restore_test.py
        env:
          PYTHONIOENCODING: utf-8

  # ──────────────────────────────────────────────────────────────────────────
  # Phase 2: Security scan
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install bandit pip-audit

      - name: Run Bandit static analysis
        # Same severity floor as security-scan.yml: LOW findings (documented
        # try/except resilience patterns, local tooling subprocess use) are
        # triaged and accepted; medium+ fails the build.
        run: bandit -r backend/src/ -f json -o bandit-results.json --severity-level medium

      - name: Run pip-audit dependency scan
        run: pip-audit --format=json --output=pip-audit-results.json

      - name: Run custom security scanner
        run: python backend/scripts/security_scan.py --full --json --output security-scan.json
        env:
          PYTHONIOENCODING: utf-8

      - name: Run penetration test
        run: python backend/scripts/penetration_test.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-results.json
            pip-audit-results.json
            security-scan.json

  # ──────────────────────────────────────────────────────────────────────────
  # Phase 3: Docker build
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Bake trained artifacts into the image: models/artifacts/ is
      # gitignored (joblib files), so a fresh checkout ships none and the
      # risk engine fails at startup reading metadata.json.
      - name: Generate synthetic data
        run: python backend/src/generate_synthetic_data.py

      - name: Train models
        run: python backend/src/train_compare.py

      - name: Build Docker image
        run: docker build -t ps14:${{ github.sha }} -f backend/Dockerfile .

      - name: Verify container runs as non-root
        run: |
          docker run --rm ps14:${{ github.sha }} whoami | grep -q ps14

      - name: Verify health check works
        run: |
          docker run --rm -d --name ps14-test \
            -e MODULE=src.front_service.main:app \
            -e PORT=8000 \
            -e JWT_SECRET=test-secret \
            -e PII_ENCRYPTION_KEY=test-key \
            -e EXPORT_SIGNING_KEY=test-sign \
            -e INTERNAL_TOKEN=test-token \
            -e COMPLIANCE_TOKEN=test-compliance \
            -e ADMIN_PASS=test-admin \
            -e DB_DIR=/tmp/db \
            -e PS14_MODE=development \
            ps14:${{ github.sha }}
          sleep 10
          docker exec ps14-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
          docker stop ps14-test

      - name: Save Docker image
        run: docker save ps14:${{ github.sha }} | gzip > ps14-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ps14-image.tar.gz

  # ──────────────────────────────────────────────────────────────────────────
  # Phase 4: Integration test (full stack in Docker)
  # ──────────────────────────────────────────────────────────────────────────
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The live walkthrough boots its own five services (ports 8001-8005)
      # and needs trained model artifacts on the runner.
      - name: Generate synthetic data
        run: python backend/src/generate_synthetic_data.py

      - name: Train models
        run: python backend/src/train_compare.py

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < ps14-image.tar.gz

      - name: Tag pre-built image for compose
        run: |
          for svc in front identity privacy risk verify audit; do
            docker tag ps14:${{ github.sha }} ps14-$svc
          done

      # Walkthrough FIRST: it needs ports 8001-8005 free, which compose
      # would hold. It self-verifies the audit chain and cleans up on exit.
      - name: Run live walkthrough
        run: bash backend/scripts/live_walkthrough.sh
        env:
          PYTHONIOENCODING: utf-8

      - name: Generate test secrets
        run: |
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV
          echo "PII_ENCRYPTION_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV
          echo "EXPORT_SIGNING_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV
          echo "INTERNAL_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV
          echo "COMPLIANCE_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV
          echo "ADMIN_PASS=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV
          echo "CORS_ORIGINS=http://localhost:8000,http://localhost:8004" >> $GITHUB_ENV

      - name: Start stack
        run: cd backend && docker compose up -d --no-build
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
          PII_ENCRYPTION_KEY: ${{ env.PII_ENCRYPTION_KEY }}
          EXPORT_SIGNING_KEY: ${{ env.EXPORT_SIGNING_KEY }}
          INTERNAL_TOKEN: ${{ env.INTERNAL_TOKEN }}
          COMPLIANCE_TOKEN: ${{ env.COMPLIANCE_TOKEN }}
          ADMIN_PASS: ${{ env.ADMIN_PASS }}
          CORS_ORIGINS: ${{ env.CORS_ORIGINS }}

      - name: Wait for health
        run: |
          declare -A SVC=( [8000]=front [8001]=identity [8002]=privacy [8003]=risk [8004]=verify [8005]=audit )
          for port in 8000 8001 8002 8003 8004 8005; do
            name="${SVC[$port]}"
            ok=0
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/health" > /dev/null 2>&1; then
                echo "[$name] :$port healthy"
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "[$name] :$port did not become healthy — compose ps + logs:"
              cd backend && docker compose ps -a || true
              cd backend && docker compose logs --tail=60 "$name" || true
              exit 1
            fi
          done

      - name: Verify audit chain
        run: |
          STATUS=$(curl -s -H "X-Internal-Token: $INTERNAL_TOKEN" http://localhost:8005/audit/integrity)
          echo "Audit integrity: $STATUS"
          echo "$STATUS" | python -c "import sys,json; d=json.load(sys.stdin); assert d['ok'], f'Chain broken: {d}'"

      - name: Dump logs on failure
        if: failure()
        run: cd backend && docker compose logs --tail=50

      - name: Cleanup
        if: always()
        run: cd backend && docker compose down -v

  # ──────────────────────────────────────────────────────────────────────────
  # Phase 5: Deploy — push image to GHCR on every merge to main
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Image
    runs-on: ubuntu-latest
    needs: [integration]
    # Run on every push to main/develop; also on version tags
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < ps14-image.tar.gz

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          SHA=${{ github.sha }}
          SHORT_SHA=${SHA:0:7}
          TAGS="${IMAGE}:${SHORT_SHA}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          # If this is a version tag, also tag with the version
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            TAGS="${TAGS},${IMAGE}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "=== Pushing image with tags: ${TAGS} ==="

      - name: Tag image
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            docker tag ps14:${{ github.sha }} "${tag}"
          done

      - name: Push to GHCR
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            echo "Pushing ${tag}..."
            docker push "${tag}"
          done

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image pushed to GHCR:** ${{ steps.meta.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ steps.meta.outputs.image }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
