<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS-14 — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:440px;padding:20px}
.card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:40px 32px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,#3b82f6,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{color:#64748b;font-size:13px;margin-top:6px}
.tabs{display:flex;gap:4px;margin-bottom:28px;background:#0f172a;border-radius:10px;padding:4px}
.tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:#64748b;transition:all .2s}
.tab.active{background:#1e293b;color:#f1f5f9}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.form-group input{width:100%;padding:12px 14px;background:#0f172a;border:1px solid #1e293b;border-radius:8px;color:#f1f5f9;font-size:14px;outline:none;transition:border .2s}
.form-group input:focus{border-color:#3b82f6}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.message{margin-top:16px;padding:12px;border-radius:8px;font-size:13px;display:none}
.message.error{background:#7f1d1d33;border:1px solid #dc2626;color:#fca5a5;display:block}
.message.success{background:#14532d33;border:1px solid #22c55e;color:#86efac;display:block}
.message.warning{background:#78350f33;border:1px solid #f59e0b;color:#fcd34d;display:block}
.rate-info{margin-top:20px;padding:16px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;font-size:12px;color:#64748b}
.rate-info h4{color:#94a3b8;margin-bottom:8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.rate-info .stat{display:flex;justify-content:space-between;margin-bottom:4px}
.rate-info .stat span:last-child{color:#f1f5f9;font-weight:500}
.attempts{margin-top:16px}
.attempts h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;margin-bottom:8px}
.attempt-log{max-height:150px;overflow-y:auto;font-family:'Fira Code',monospace;font-size:11px;line-height:1.6}
.attempt-log .ok{color:#22c55e}
.attempt-log .fail{color:#ef4444}
.attempt-log .blocked{color:#f59e0b}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff33;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="logo">
      <h1>🛡️ PS-14</h1>
      <p>Privacy-First Fraud Detection — User Portal</p>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <!-- Register Form -->
    <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg_name" required placeholder="Jane Doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg_email" required placeholder="jane@example.com">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="reg_phone" required placeholder="+1234567890">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg_password" required minlength="8" placeholder="Min 8 characters">
      </div>
      <button type="submit" class="btn btn-primary" id="regBtn">Create Account</button>
      <div class="message" id="regMsg"></div>
    </form>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login_email" required placeholder="jane@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login_password" required placeholder="Your password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
      <div class="message" id="loginMsg"></div>
    </form>

    <!-- Rate Limit Info -->
    <div class="rate-info">
      <h4>🔒 Rate Limiting Active</h4>
      <div class="stat"><span>Login limit:</span><span>5 attempts / 60s</span></div>
      <div class="stat"><span>Brute-force lock:</span><span>10 failures → 15 min block</span></div>
      <div class="stat"><span>Register limit:</span><span>3 attempts / 5 min</span></div>
      <div class="stat"><span>Keyed on:</span><span>Client IP (User-Agent ignored)</span></div>
    </div>

    <!-- Attempt Log -->
    <div class="attempts">
      <h4>📋 Live Attempt Log</h4>
      <div class="attempt-log" id="attemptLog">
        <div style="color:#475569">No attempts yet — try logging in</div>
      </div>
    </div>
  </div>
</div>

<script>
const IDENTITY_URL = window.location.origin; // proxy through front service
let attemptCount = 0;
let logEntries = [];

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  if (tab === 'login') document.querySelectorAll('.tab')[0].classList.add('active');
  else document.querySelectorAll('.tab')[1].classList.add('active');
}

function addLog(type, msg) {
  attemptCount++;
  const now = new Date().toLocaleTimeString();
  const cls = type === 'ok' ? 'ok' : type === 'blocked' ? 'blocked' : 'fail';
  logEntries.unshift(`<div class="${cls}">[${now}] #${attemptCount} ${msg}</div>`);
  if (logEntries.length > 20) logEntries.pop();
  document.getElementById('attemptLog').innerHTML = logEntries.join('');
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('regBtn');
  const msg = document.getElementById('regMsg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Creating...';
  msg.className = 'message';
  msg.style.display = 'none';

  try {
    const r = await fetch(`${IDENTITY_URL}/auth/register`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        full_name: document.getElementById('reg_name').value,
        email: document.getElementById('reg_email').value,
        phone: document.getElementById('reg_phone').value,
        password: document.getElementById('reg_password').value,
      })
    });
    const data = await r.json();
    if (r.status === 201) {
      msg.className = 'message success';
      msg.textContent = `✓ Account created! Fraud ID: ${data.fraud_id}`;
      addLog('ok', `REGISTER → ${r.status} (fraud_id: ${data.fraud_id})`);
    } else if (r.status === 429) {
      msg.className = 'message warning';
      msg.textContent = `⚠ Rate limited: ${data.detail}`;
      addLog('blocked', `REGISTER → 429 ${data.detail}`);
    } else {
      msg.className = 'message error';
      msg.textContent = `✗ ${data.detail || 'Registration failed'}`;
      addLog('fail', `REGISTER → ${r.status} ${data.detail}`);
    }
  } catch (err) {
    msg.className = 'message error';
    msg.textContent = `✗ Service unavailable: ${err.message}`;
    addLog('fail', `REGISTER → ERROR ${err.message}`);
  }
  btn.disabled = false;
  btn.textContent = 'Create Account';
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in...';
  msg.className = 'message';
  msg.style.display = 'none';

  try {
    const r = await fetch(`${IDENTITY_URL}/auth/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('login_email').value,
        password: document.getElementById('login_password').value,
      })
    });
    const data = await r.json();
    if (r.status === 200) {
      msg.className = 'message success';
      msg.textContent = `✓ Login successful! Role: ${data.role}`;
      addLog('ok', `LOGIN → ${r.status} role=${data.role}`);
    } else if (r.status === 429) {
      msg.className = 'message warning';
      msg.textContent = `⚠ Rate limited: ${data.detail}`;
      addLog('blocked', `LOGIN → 429 ${data.detail}`);
    } else {
      msg.className = 'message error';
      msg.textContent = `✗ ${data.detail || 'Login failed'}`;
      addLog('fail', `LOGIN → ${r.status} ${data.detail}`);
    }
  } catch (err) {
    msg.className = 'message error';
    msg.textContent = `✗ Service unavailable: ${err.message}`;
    addLog('fail', `LOGIN → ERROR ${err.message}`);
  }
  btn.disabled = false;
  btn.textContent = 'Sign In';
}
</script>
</body>
</html>
