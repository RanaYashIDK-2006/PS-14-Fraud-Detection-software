# PS-14 — six services, one command: `docker compose up --build -d`
#
# CHANGE THESE before any non-local deployment (see HOSTING.md):
#   JWT_SECRET, INTERNAL_TOKEN, COMPLIANCE_TOKEN — never the dev defaults.
# The prototype shares one SQLite volume (dbdata); production moves each
# store to its own Postgres with per-store credentials (architecture §2/§4).
name: ps14

services:
  front:
    build: .
    command: sh -c "uvicorn src.front_service.main:app --host 0.0.0.0 --port 8000"
    environment: &shared-env
      DB_DIR: /app/db
      # Dev compose: skip the production fail-closed gate (default CORS would
      # abort boot). Production deployments use docker-compose.prod.yml,
      # which sets PS14_MODE=production.
      PS14_MODE: development
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?Set PII_ENCRYPTION_KEY in .env}
      EXPORT_SIGNING_KEY: ${EXPORT_SIGNING_KEY:?Set EXPORT_SIGNING_KEY in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env}
      COMPLIANCE_TOKEN: ${COMPLIANCE_TOKEN:?Set COMPLIANCE_TOKEN in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?Set ADMIN_PASS in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8000,http://127.0.0.1:8004,http://localhost:8000,http://localhost:8004}
      IDENTITY_URL: http://identity:8001
      PRIVACY_URL: http://privacy:8002
      RISK_URL: http://risk:8003
      AUDIT_URL: http://audit:8005
      VERIFY_URL: http://verify:8004
    ports: ["8000:8000"]
    volumes: [dbdata:/app/db]
    healthcheck: &healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  identity:
    build: .
    command: sh -c "uvicorn src.identity_service.main:app --host 0.0.0.0 --port 8001"
    environment: *shared-env
    ports: ["8001:8001"]
    volumes: [dbdata:/app/db]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]

  privacy:
    build: .
    command: sh -c "uvicorn src.privacy_layer.main:app --host 0.0.0.0 --port 8002"
    environment: *shared-env
    ports: ["8002:8002"]
    volumes: [dbdata:/app/db]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]

  risk:
    build: .
    command: sh -c "uvicorn src.risk_engine.main:app --host 0.0.0.0 --port 8003"
    environment: *shared-env
    ports: ["8003:8003"]
    volumes: [dbdata:/app/db]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]

  verify:
    build: .
    command: sh -c "uvicorn src.verification_service.main:app --host 0.0.0.0 --port 8004"
    environment: *shared-env
    ports: ["8004:8004"]
    volumes: [dbdata:/app/db]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=2)"]

  audit:
    build: .
    command: sh -c "uvicorn src.audit_service.main:app --host 0.0.0.0 --port 8005"
    environment: *shared-env
    ports: ["8005:8005"]
    volumes: [dbdata:/app/db]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=2)"]

  # --------------------------------------------------------------------------
  # Retrain path (profile-gated, no ports): runs the FULL training pipeline
  # (retrain -> retune -> apply rules.yaml -> all test suites incl. the OOD
  # recall gate) in a container, writing fresh artifacts to ./models and
  # ./data on the HOST via bind mounts. Exit 0 == the gate passed. Drive it
  # with `bash scripts/docker_retrain.sh` (runs this, then rebuilds + restarts
  # the risk service) or `make retrain`.
  #   docker compose --profile train run --rm train
  train:
    build: .
    profiles: ["train"]
    command: sh -c "python scripts/training_pipeline.py --full"
    environment: *shared-env
    volumes:
      - dbdata:/app/db
      - ./models:/app/models   # artifacts + tuner cache persist on the host
      - ./data:/app/data       # regenerated data / feedback pool persist
    restart: "no"

volumes:
  dbdata:
