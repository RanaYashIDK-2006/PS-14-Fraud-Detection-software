# Alembic configuration for PS-14
# Multi-schema PostgreSQL with per-service isolation

[alembic]
script_location = alembic
prepend_sys_path = .

# Database URL — overridden by env.py from settings
# For local dev: set DATABASE_URL env var
# For production: set via deployment configuration
sqlalchemy.url = sqlite:///db/risk.db

# Multi-schema support
version_path_separator = os

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
