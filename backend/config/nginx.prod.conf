# PS-14 Production Nginx Configuration
# Load balancer with health checks, rate limiting, and TLS termination.
#
# Upstream workers: round-robin across Gunicorn workers within each service.
# The risk engine has 4 workers; others have 2 each.
# Concurrency SLO: max 50 concurrent per worker for P99 < 100ms.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr"'
    '}';
    access_log /var/log/nginx/access.log json;

    # ── Performance ──────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Request-ID $request_id always;

    # ── Rate limiting zones ──────────────────────────────────────────
    # General: 100 req/s per IP, burst 20
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    # Auth: 5 req/min per IP (brute force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # Internal: 500 req/min per IP (service-to-service)
    limit_req_zone $binary_remote_addr zone=internal:10m rate=500r/m;

    # ── Upstreams ────────────────────────────────────────────────────
    upstream front {
        server front:8000;
        keepalive 32;
    }

    upstream risk {
        # Gunicorn with 4 workers behind single port
        server risk:8003;
        keepalive 64;
    }

    upstream identity {
        server identity:8001;
        keepalive 16;
    }

    upstream privacy {
        server privacy:8002;
        keepalive 32;
    }

    upstream verify {
        server verify:8004;
        keepalive 16;
    }

    upstream audit {
        server audit:8005;
        keepalive 16;
    }

    upstream inference {
        server inference:8006;
        keepalive 32;
    }

    # ── Server block ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health check for nginx itself
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Front service (landing page, admin, monitor) ─────────────
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://front;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Admin login: stricter rate limit ─────────────────────────
        location /admin/login {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://front;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Risk engine (highest throughput path) ────────────────────
        location /internal/ {
            limit_req zone=internal burst=50 nodelay;
            proxy_pass http://risk;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 10s;
            proxy_connect_timeout 3s;
        }

        # ── Inference batch scoring ──────────────────────────────────
        location /batch/ {
            limit_req zone=internal burst=20 nodelay;
            proxy_pass http://inference;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # ── Identity service ─────────────────────────────────────────
        location /auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://identity;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Privacy layer ────────────────────────────────────────────
        location /privacy/ {
            limit_req zone=internal burst=50 nodelay;
            proxy_pass http://privacy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Verification ─────────────────────────────────────────────
        location /verification/ {
            proxy_pass http://verify;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Audit ────────────────────────────────────────────────────
        location /audit/ {
            proxy_pass http://audit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Block sensitive paths ────────────────────────────────────
        location ~ /\. { deny all; }
        location ~* \.(py|pyc|env)$ { deny all; }
    }

    # ── TLS server block (uncomment when certs are available) ────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/cert.pem;
    #     ssl_certificate_key /etc/nginx/certs/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ... same location blocks as above ...
    # }
}
