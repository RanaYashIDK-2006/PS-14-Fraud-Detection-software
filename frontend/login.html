<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS-14 — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #020617; color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .bg-mesh {
    position: fixed; inset: 0; z-index: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 20% 40%, rgba(59,130,246,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 20%, rgba(139,92,246,0.06) 0%, transparent 50%);
  }
  .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(30, 41, 59, 0.5); }
  .gradient-text { background: linear-gradient(135deg, #3b82f6, #8b5cf6, #10b981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
</style>
</head>
<body>
<div class="bg-mesh"></div>

<div class="relative z-10 w-full max-w-md mx-4">
  <div class="glass rounded-2xl p-8">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center mx-auto mb-3">
        <span class="text-2xl">🛡️</span>
      </div>
      <h1 class="text-2xl font-bold gradient-text">PS-14</h1>
      <p class="text-sm text-slate-500 mt-1">Privacy-First Fraud Detection</p>
    </div>

    <!-- Tabs -->
    <div class="flex gap-1 p-1 rounded-xl bg-slate-900/50 mb-6">
      <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2.5 text-sm font-medium rounded-lg bg-slate-800 text-white transition-all">Sign In</button>
      <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-2.5 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-300 transition-all">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email</label>
        <input type="email" id="login_email" required placeholder="jane@example.com"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
        <input type="password" id="login_password" required placeholder="Your password"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
      </div>
      <button type="submit" id="loginBtn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold rounded-xl hover:opacity-90 transition-all text-sm">
        Sign In
      </button>
      <div id="loginMsg" class="mt-3 text-sm text-center hidden"></div>
    </form>

    <!-- Register Form -->
    <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="mb-3">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Full Name</label>
        <input type="text" id="reg_name" required placeholder="Jane Doe"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
      </div>
      <div class="mb-3">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email</label>
        <input type="email" id="reg_email" required placeholder="jane@example.com"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
      </div>
      <div class="mb-3">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Phone</label>
        <input type="tel" id="reg_phone" required placeholder="+1234567890"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
        <input type="password" id="reg_password" required minlength="8" placeholder="Min 8 characters"
          class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
      </div>
      <button type="submit" id="regBtn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold rounded-xl hover:opacity-90 transition-all text-sm">
        Create Account
      </button>
      <div id="regMsg" class="mt-3 text-sm text-center hidden"></div>
    </form>

    <!-- Rate Limit Info -->
    <div class="mt-6 p-4 rounded-xl bg-slate-900/50 border border-slate-800 text-xs text-slate-500">
      <div class="flex justify-between mb-1"><span>Login limit:</span><span class="text-slate-300">5 attempts / 60s</span></div>
      <div class="flex justify-between mb-1"><span>Brute-force lock:</span><span class="text-slate-300">10 failures → 15 min</span></div>
      <div class="flex justify-between"><span>Register limit:</span><span class="text-slate-300">3 attempts / 5 min</span></div>
    </div>

    <!-- Attempt Log -->
    <div class="mt-4">
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Live Log</div>
      <div id="attemptLog" class="max-h-32 overflow-y-auto text-xs font-mono text-slate-500 space-y-1">
        <div>No attempts yet</div>
      </div>
    </div>
  </div>

  <div class="text-center mt-4 text-xs text-slate-600">
    PS-14 · Privacy-First AI Fraud Detection · DPDP Act 2023
  </div>
</div>

<script>
const ORIGIN = window.location.origin;
let attemptCount = 0;
let logEntries = [];

function switchTab(tab) {
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').className = tab === 'login' ? 'flex-1 py-2.5 text-sm font-medium rounded-lg bg-slate-800 text-white transition-all' : 'flex-1 py-2.5 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-300 transition-all';
  document.getElementById('tab-register').className = tab === 'register' ? 'flex-1 py-2.5 text-sm font-medium rounded-lg bg-slate-800 text-white transition-all' : 'flex-1 py-2.5 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-300 transition-all';
}

function addLog(type, msg) {
  attemptCount++;
  const now = new Date().toLocaleTimeString();
  const cls = type === 'ok' ? 'text-green-400' : type === 'blocked' ? 'text-amber-400' : 'text-red-400';
  logEntries.unshift('<div class="' + cls + '">[' + now + '] #' + attemptCount + ' ' + msg + '</div>');
  if (logEntries.length > 15) logEntries.pop();
  document.getElementById('attemptLog').innerHTML = logEntries.join('');
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  msg.className = 'mt-3 text-sm text-center hidden';

  try {
    const r = await fetch(ORIGIN + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('login_email').value,
        password: document.getElementById('login_password').value,
      })
    });
    const data = await r.json();
    if (r.status === 200) {
      msg.className = 'mt-3 text-sm text-center text-green-400';
      msg.textContent = '✓ Login successful! Role: ' + data.role;
      msg.classList.remove('hidden');
      addLog('ok', 'LOGIN → ' + r.status + ' role=' + data.role);
      sessionStorage.setItem('ps14_token', data.access_token || '');
      sessionStorage.setItem('ps14_role', data.role || '');
      setTimeout(function() { window.location.href = '/'; }, 1000);
    } else if (r.status === 429) {
      msg.className = 'mt-3 text-sm text-center text-amber-400';
      msg.textContent = '⚠ Rate limited: ' + data.detail;
      msg.classList.remove('hidden');
      addLog('blocked', 'LOGIN → 429 ' + data.detail);
    } else {
      msg.className = 'mt-3 text-sm text-center text-red-400';
      msg.textContent = '✗ ' + (data.detail || 'Login failed');
      msg.classList.remove('hidden');
      addLog('fail', 'LOGIN → ' + r.status + ' ' + data.detail);
    }
  } catch (err) {
    msg.className = 'mt-3 text-sm text-center text-red-400';
    msg.textContent = '✗ Service unavailable';
    msg.classList.remove('hidden');
    addLog('fail', 'LOGIN → ERROR ' + err.message);
  }
  btn.disabled = false;
  btn.textContent = 'Sign In';
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('regBtn');
  const msg = document.getElementById('regMsg');
  btn.disabled = true;
  btn.textContent = 'Creating...';
  msg.className = 'mt-3 text-sm text-center hidden';

  try {
    const r = await fetch(ORIGIN + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        full_name: document.getElementById('reg_name').value,
        email: document.getElementById('reg_email').value,
        phone: document.getElementById('reg_phone').value,
        password: document.getElementById('reg_password').value,
      })
    });
    const data = await r.json();
    if (r.status === 201) {
      msg.className = 'mt-3 text-sm text-center text-green-400';
      msg.textContent = '✓ Account created! Fraud ID: ' + data.fraud_id;
      msg.classList.remove('hidden');
      addLog('ok', 'REGISTER → ' + r.status + ' (fraud_id: ' + data.fraud_id + ')');
    } else if (r.status === 429) {
      msg.className = 'mt-3 text-sm text-center text-amber-400';
      msg.textContent = '⚠ Rate limited: ' + data.detail;
      msg.classList.remove('hidden');
      addLog('blocked', 'REGISTER → 429 ' + data.detail);
    } else {
      msg.className = 'mt-3 text-sm text-center text-red-400';
      msg.textContent = '✗ ' + (data.detail || 'Registration failed');
      msg.classList.remove('hidden');
      addLog('fail', 'REGISTER → ' + r.status + ' ' + data.detail);
    }
  } catch (err) {
    msg.className = 'mt-3 text-sm text-center text-red-400';
    msg.textContent = '✗ Service unavailable';
    msg.classList.remove('hidden');
    addLog('fail', 'REGISTER → ERROR ' + err.message);
  }
  btn.disabled = false;
  btn.textContent = 'Create Account';
}
</script>
</body>
</html>
